<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Black Label Autos</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --accent-gold: #c9a227;
            --accent-gold-light: #e8d48b;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.2rem 5%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201, 162, 39, 0.2);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--bg-primary);
        }

        .nav-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .nav-logo-text span {
            color: var(--accent-gold);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 120px 20px 60px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header h1 span {
            color: var(--accent-gold);
        }

        .page-header p {
            color: var(--text-secondary);
        }

        .booking-form {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group label span {
            color: var(--accent-gold);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .time-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-selector select {
            width: auto;
            min-width: 70px;
            text-align: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .time-separator {
            color: var(--accent-gold);
            font-size: 1.3rem;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent-gold);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--accent-gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, 0.3);
        }

        .success-message {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            border-radius: 8px;
            text-align: center;
        }

        .success-message.visible {
            display: block;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon">
                <i class="fas fa-crown"></i>
            </div>
            <div class="nav-logo-text">BLACK <span>LABEL</span></div>
        </a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Book <span>Appointment</span></h1>
            <p>Schedule your private viewing or test drive</p>
        </div>

        <!-- Netlify Form - submits to Netlify, triggers function -->
        <form class="booking-form" name="appointments" method="POST" data-netlify="true" action="/success">
            <input type="hidden" name="form-name" value="appointments">
            
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span>*</span></label>
                    <input type="text" name="name" required placeholder="Von Hayes">
                </div>
                <div class="form-group">
                    <label>State ID <span>*</span></label>
                    <input type="text" name="state_id" required placeholder="3288">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number <span>*</span></label>
                    <input type="tel" name="phone" required placeholder="4242120069">
                </div>
                <div class="form-group">
                    <label>Vehicle Interest <span>*</span></label>
                    <select name="car_interest" id="car_interest" required>
                        <option value="">Select a vehicle...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date <span>*</span></label>
                    <input type="date" name="appointment_date" id="appointment_date" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time <span>*</span></label>
                    <div class="time-selector">
                        <select name="appointment_hour" id="hour-select" required></select>
                        <span class="time-separator">:</span>
                        <select name="appointment_minute" id="minute-select" required></select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Financing Interest</label>
                    <select name="financing">
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="IDK">IDK</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label>Additional Notes</label>
                    <textarea name="notes" rows="3" placeholder="Any specific requests or questions..."></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-calendar-check"></i> Book Appointment
            </button>

            <div class="success-message" id="successMsg">
                ✓ Appointment booked! Check your phone for confirmation.
            </div>
        </form>
    </div>

    <script>
        // Vehicle inventory data
        const vehicles = [
            { name: "Grotti Turismo Omaggio", price: "$425,833" },
            { name: "Bravado Banshee GTS", price: "$402,500" },
            { name: "Pegassi Infernus", price: "$401,400" },
            { name: "Pegassi Tempesta Spyder", price: "$388,312" },
            { name: "Grotti Itali GTO", price: "$366,465" },
            { name: "Obey 10F Widebody", price: "$363,593" },
            { name: "Pegassi Zorrusso", price: "$362,250" },
            { name: "Lampadati Corsita", price: "$352,100" },
            { name: "Pegassi Reaper", price: "$345,000" },
            { name: "Bravado Banshee 900R", price: "$330,093" },
            { name: "Pegassi Tempesta Fuoristrada", price: "$323,872" },
            { name: "Benefactor Schlagen SP", price: "$305,965" },
            { name: "Dinka Nexus RR", price: "$302,662" },
            { name: "Pegassi Tempesta", price: "$299,588" },
            { name: "Ubermacht Sentinel XS", price: "$292,500" },
            { name: "Pegassi Vacca", price: "$290,625" },
            { name: "Hijak Tachyon", price: "$245,625" },
            { name: "Obey 10F Cabrio", price: "$245,625" },
            { name: "Benefactor Schlagen Roadster", price: "$225,301" },
            { name: "Dewbauchee Solace Vitesse", price: "$218,750" },
            { name: "Pegassi Vacca", price: "$211,850" },
            { name: "Benefactor Schlagen GT", price: "$211,850" }
        ];

        // Populate vehicle dropdown
        function populateVehicles() {
            const select = document.getElementById('car_interest');
            vehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = v.name + ' (' + v.price + ')';
                select.appendChild(opt);
            });
        }

        // Check for pre-selected car from URL
        function checkPreselected() {
            const params = new URLSearchParams(window.location.search);
            const car = params.get('car');
            if (car) {
                const select = document.getElementById('car_interest');
                const decoded = decodeURIComponent(car);
                // Try to find and select it
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === decoded) {
                        select.selectedIndex = i;
                        return;
                    }
                }
                // If not found, add it
                const opt = document.createElement('option');
                opt.value = decoded;
                opt.textContent = decoded;
                select.insertBefore(opt, select.options[1]);
                select.selectedIndex = 1;
            }
        }

        // Initialize time selector
        function initTime() {
            const hourSel = document.getElementById('hour-select');
            const minSel = document.getElementById('minute-select');
            const dateInput = document.getElementById('appointment_date');

            // Hours 0-23
            for (let i = 0; i < 24; i++) {
                const opt = document.createElement('option');
                opt.value = String(i).padStart(2, '0');
                opt.textContent = String(i).padStart(2, '0');
                hourSel.appendChild(opt);
            }

            // Minutes: only 00, 30
            ['00', '30'].forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                minSel.appendChild(opt);
            });

            hourSel.value = '14';
            minSel.value = '00';

            // Min date = today
            dateInput.min = new Date().toISOString().split('T')[0];
        }

        // Show success message if form submitted
        if (window.location.search.includes('success')) {
            document.getElementById('successMsg').classList.add('visible');
        }

        // Init
        populateVehicles();
        checkPreselected();
        initTime();
    </script>
</body>
</html>
