<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Label Autos | Supercar Inventory</title>

    <link rel="icon" type="image/svg+xml" href="assets/Mark/favicon-32.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/Mark/favicon-32-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/Mark/favicon-16-16.png">
    <link rel="apple-touch-icon" href="assets/Mark/mark-plate-gold-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================
           BLACK LABEL TOKENS (dark theme)
           Semantic tokens only. Page CSS below never uses a raw hex.
           ========================================================== */
        :root, [data-theme="dark"] {
            color-scheme: dark;

            --surface-page: #0d0b0a;
            --surface: #171513;
            --surface-raised: #22201d;
            --surface-overlay: #2d2a27;
            --surface-sunk: #0d0b0a;

            --text-primary: #f8f6f5;
            --text-secondary: #bab7b3;
            --text-muted: #989591;
            --text-disabled: #7c7975;
            --text-accent: #ddad57;
            --text-on-accent: #0d0b0a;

            --accent: #ddad57;
            --accent-hover: #e9bf76;
            --accent-pressed: #cc9835;
            --accent-wash: #ddad5714;
            --accent-border: #ddad5747;
            --focus-ring: #ddad57;
            --border-hairline: #2d2a27;
            --border: #3f3d39;
            --border-control: #8e703c;
            --border-strong: #af801c;

            --success-text: #8bdcc2;  --success-solid: #69c6aa;  --success-wash: #69c6aa14;  --success-border: #69c6aa52;
            --warning-text: #ffaa6b;  --warning-solid: #f38d3a;  --warning-wash: #f38d3a14;  --warning-border: #f38d3a52;
            --danger-text: #ed7473;   --danger-solid: #e55458;   --danger-wash: #e5545814;   --danger-border: #e5545852;
            --info-text: #9dc5ec;     --info-solid: #80b1e0;     --info-wash: #80b1e014;     --info-border: #80b1e052;

            --scrim: #0d0b0ab8;
            --metal-highlight: #ddad571a;
            --metal-shade: #000000a6;
            --image-vignette: #0d0b0a59;
            --badge-backing: #171513eb;

            --font-display: Archivo, 'Archivo Expanded', 'Helvetica Neue', Arial, sans-serif;
            --font-sans: 'Instrument Sans', Archivo, 'Helvetica Neue', Arial, sans-serif;
            --font-data: Archivo, 'Helvetica Neue', Arial, sans-serif;

            --text-display-2xl: 700 72px/68px var(--font-display);
            --text-display-xl: 700 56px/54px var(--font-display);
            --text-display-lg: 700 44px/46px var(--font-display);
            --text-display-md: 700 34px/38px var(--font-display);
            --text-heading-1: 700 28px/34px var(--font-display);
            --text-heading-2: 700 22px/28px var(--font-display);
            --text-heading-3: 600 18px/24px var(--font-display);
            --text-eyebrow: 600 11px/14px var(--font-display);
            --text-title-lg: 600 20px/28px var(--font-sans);
            --text-title: 600 17px/24px var(--font-sans);
            --text-body-lg: 400 17px/28px var(--font-sans);
            --text-body: 400 15px/24px var(--font-sans);
            --text-body-sm: 400 13.5px/20px var(--font-sans);
            --text-label: 500 13px/16px var(--font-sans);
            --text-label-micro: 600 11.5px/14px var(--font-sans);
            --text-caption: 400 12px/16px var(--font-sans);
            --text-button: 600 14px/16px var(--font-sans);
            --text-button-sm: 600 13px/16px var(--font-sans);
            --text-input-touch: 400 16px/24px var(--font-sans);
            --text-price-xl: 600 34px/36px var(--font-data);
            --text-price: 600 22px/26px var(--font-data);
            --text-price-sm: 600 16px/20px var(--font-data);
            --text-numeric: 500 15px/20px var(--font-data);
            --text-numeric-sm: 500 13px/18px var(--font-data);
            --text-stat: 600 26px/30px var(--font-data);

            --space-half: 2px; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
            --space-16: 64px; --space-20: 80px; --space-24: 96px; --space-32: 128px;

            --radius-none: 0; --radius-xs: 2px; --radius-sm: 3px; --radius-md: 4px; --radius-lg: 6px; --radius-full: 999px;

            --shadow-none: none;
            --shadow-raised: 0 1px 2px #0000004d, 0 8px 24px #00000059;
            --shadow-overlay: 0 4px 8px #00000059, 0 16px 40px #00000073;
            --shadow-modal: 0 8px 16px #00000066, 0 32px 80px #0000008c;
            --shadow-focus: 0 0 0 2px var(--surface-page), 0 0 0 4px var(--focus-ring);

            --stroke-1: 1px; --stroke-2: 2px; --stroke-3: 3px;
            --opacity-disabled: 0.4; --opacity-image-veil: 0.18;

            --control-sm: 32px; --control-md: 40px; --control-lg: 48px; --control-xl: 56px; --tap-min: 44px;
            --icon-sm: 16px; --icon-md: 20px; --icon-lg: 24px; --icon-xl: 32px;
            --plate-nav: 28px; --field-max: 520px; --rail-w: 280px;
            --container-prose: 680px; --container-md: 900px; --container-lg: 1180px; --container-xl: 1400px;
            --z-base: 0; --z-raised: 10; --z-sticky: 100; --z-drawer: 400; --z-modal: 500; --z-toast: 700; --z-tooltip: 900;

            --bl-dur-fast: 120ms; --bl-dur: 200ms; --bl-dur-slow: 320ms; --bl-dur-deliberate: 520ms;
            --bl-ease: cubic-bezier(.2, .7, .2, 1);

            --nav-h: calc(var(--space-16) + var(--space-2));
            --page-gutter: var(--space-12);
        }

        @media (max-width: 1180px) {
            :root {
                --text-display-2xl: 700 56px/54px var(--font-display);
                --text-display-xl: 700 44px/46px var(--font-display);
                --text-display-lg: 700 40px/44px var(--font-display);
            }
        }
        @media (max-width: 1024px) { :root { --page-gutter: var(--space-8); } }
        @media (max-width: 860px) {
            :root {
                --text-display-2xl: 700 44px/46px var(--font-display);
                --text-display-xl: 700 34px/38px var(--font-display);
                --text-display-lg: 700 34px/38px var(--font-display);
            }
        }
        @media (max-width: 768px) { :root { --page-gutter: var(--space-4); } }
        @media (max-width: 520px) {
            :root {
                --text-display-2xl: 700 34px/38px var(--font-display);
                --text-display-xl: 700 30px/34px var(--font-display);
                --text-display-lg: 700 30px/34px var(--font-display);
                --text-display-md: 700 28px/34px var(--font-display);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            :root { --bl-dur-fast: 1ms; --bl-dur: 1ms; --bl-dur-slow: 1ms; --bl-dur-deliberate: 1ms; }
            *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
        }

        /* ==========================================================
           BASE
           ========================================================== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--surface-page); }

        body {
            font: var(--text-body);
            background: var(--surface-page);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
            overflow-x: hidden;
        }

        img { display: block; max-width: 100%; }
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; color: inherit; }
        :focus { outline: none; }
        :focus-visible { outline: none; box-shadow: var(--shadow-focus); }
        ::selection { background: var(--accent); color: var(--text-on-accent); }

        h1, h2, h3, .heading-3 { font-stretch: 112%; letter-spacing: -0.01em; }
        .heading-3 { font: var(--text-heading-3); font-stretch: 112%; }

        .bl-ic {
            width: var(--icon-md);
            height: var(--icon-md);
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: butt;
            stroke-linejoin: miter;
        }
        .bl-ic--sm { width: var(--icon-sm); height: var(--icon-sm); }
        .bl-ic--lg { width: var(--icon-lg); height: var(--icon-lg); }
        .bl-ic--xl { width: var(--icon-xl); height: var(--icon-xl); }

        .bl-only-narrow { display: none !important; }
        @media (max-width: 1024px) {
            .bl-only-narrow { display: inline-flex !important; }
            .bl-only-wide { display: none !important; }
        }

        /* ==========================================================
           BUTTONS
           ========================================================== */
        .bl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            height: var(--control-md);
            padding: 0 var(--space-4);
            border: var(--stroke-1) solid transparent;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-primary);
            font: var(--text-button);
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
            transition: background-color var(--bl-dur-fast) var(--bl-ease), border-color var(--bl-dur-fast) var(--bl-ease), color var(--bl-dur-fast) var(--bl-ease);
        }
        .bl-btn .bl-ic { width: var(--icon-sm); height: var(--icon-sm); }
        .bl-btn--primary { background: var(--accent); color: var(--text-on-accent); }
        .bl-btn--primary:hover { background: var(--accent-hover); }
        .bl-btn--primary:active { background: var(--accent-pressed); }
        .bl-btn--secondary { border-color: var(--border-control); }
        .bl-btn--secondary:hover { border-color: var(--border-strong); background: var(--accent-wash); }
        .bl-btn--tertiary { color: var(--text-secondary); padding: 0 var(--space-2); }
        .bl-btn--tertiary:hover { color: var(--text-primary); }
        .bl-btn--sm { height: var(--control-sm); padding: 0 var(--space-3); font: var(--text-button-sm); }
        .bl-btn--lg { height: var(--control-lg); padding: 0 var(--space-6); }
        .bl-btn--block { width: 100%; }
        .bl-btn--icon { width: var(--control-md); padding: 0; }
        .bl-btn--icon.bl-btn--sm { width: var(--control-sm); }
        @media (pointer: coarse) { .bl-btn { min-height: var(--tap-min); } .bl-btn--icon { min-width: var(--tap-min); } }
        @media (max-width: 768px) { .bl-btn--primary.bl-btn--lg { height: var(--control-xl); } }

        /* ==========================================================
           FORM CONTROLS
           ========================================================== */
        .bl-input {
            width: 100%;
            height: var(--control-md);
            padding: 0 var(--space-3);
            background: var(--surface-sunk);
            border: var(--stroke-1) solid var(--border-control);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font: var(--text-body);
            transition: border-color var(--bl-dur-fast) var(--bl-ease);
        }
        .bl-input::placeholder { color: var(--text-muted); }
        .bl-input:hover { border-color: var(--border-strong); }
        .bl-input:focus, .bl-input:focus-visible { border-color: var(--border-strong); box-shadow: var(--shadow-focus); }
        select.bl-input { appearance: none; -webkit-appearance: none; padding-right: var(--space-10); cursor: pointer; }
        select.bl-input option { background: var(--surface-raised); color: var(--text-primary); }
        @media (max-width: 768px) { .bl-input { font: var(--text-input-touch); } }

        .bl-select { position: relative; display: block; }
        .bl-select > .bl-ic {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            width: var(--icon-sm);
            height: var(--icon-sm);
            color: var(--text-muted);
            pointer-events: none;
        }

        .bl-search { position: relative; display: block; }
        .bl-search > .bl-ic {
            position: absolute;
            left: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            width: var(--icon-sm);
            height: var(--icon-sm);
            color: var(--text-muted);
            pointer-events: none;
        }
        .bl-search .bl-input { padding-left: var(--space-10); }

        .bl-choice {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--space-3);
            min-height: var(--control-sm);
            cursor: pointer;
            color: var(--text-secondary);
        }
        .bl-choice input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .bl-box {
            flex: none;
            display: grid;
            place-items: center;
            width: calc(var(--icon-sm) + var(--space-half));
            height: calc(var(--icon-sm) + var(--space-half));
            background: var(--surface-sunk);
            border: var(--stroke-1) solid var(--border-control);
            border-radius: var(--radius-xs);
            color: var(--text-on-accent);
            transition: background-color var(--bl-dur-fast) var(--bl-ease), border-color var(--bl-dur-fast) var(--bl-ease);
        }
        .bl-box .bl-ic { width: var(--space-3); height: var(--space-3); stroke-width: 2; opacity: 0; }
        .bl-choice:hover .bl-box { border-color: var(--border-strong); }
        .bl-choice input:checked + .bl-box { background: var(--accent); border-color: var(--accent); }
        .bl-choice input:checked + .bl-box .bl-ic { opacity: 1; }
        .bl-choice input:checked ~ .bl-choice-text { color: var(--text-primary); }
        .bl-choice input:focus-visible + .bl-box { box-shadow: var(--shadow-focus); }
        @media (pointer: coarse) { .bl-choice { min-height: var(--tap-min); } }

        /* ==========================================================
           NAVBAR
           ========================================================== */
        nav.bl-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            z-index: var(--z-sticky);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-6);
            padding: 0 var(--page-gutter);
            background: var(--surface);
            border-bottom: var(--stroke-1) solid var(--border-hairline);
        }
        .nav-logo { display: inline-flex; align-items: center; flex: none; border-radius: var(--radius-sm); }
        .nav-logo img { height: var(--plate-nav); width: auto; }

        .nav-links { display: flex; align-self: stretch; gap: var(--space-8); list-style: none; }
        .nav-links li { display: flex; }
        .nav-links a {
            position: relative;
            display: flex;
            align-items: center;
            font: var(--text-button);
            color: var(--text-secondary);
            transition: color var(--bl-dur-fast) var(--bl-ease);
        }
        .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--text-primary); }
        .nav-links a[aria-current="page"]::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(var(--stroke-1) * -1);
            height: var(--stroke-2);
            background: var(--accent);
        }
        @media (max-width: 1024px) { .nav-links { display: none; } }
        .nav-cta .label-short { display: none; }
        @media (max-width: 520px) {
            .nav-logo img { height: calc(var(--plate-nav) - var(--space-1)); }
            .nav-cta .label-long { display: none; }
            .nav-cta .label-short { display: inline; }
        }

        /* ==========================================================
           SHELL: filter rail + results
           ========================================================== */
        .main-container {
            display: grid;
            grid-template-columns: var(--rail-w) minmax(0, 1fr);
            min-height: 100vh;
            padding-top: var(--nav-h);
        }

        .sheet-toggle { display: none; position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        @media (max-width: 1024px) { .sheet-toggle { display: block; } }
        .sheet-scrim { display: none; }

        .sidebar {
            position: sticky;
            top: var(--nav-h);
            height: calc(100vh - var(--nav-h));
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-right: var(--stroke-1) solid var(--border-hairline);
        }
        .sidebar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-6) var(--space-6) var(--space-2);
        }
        .sidebar-body { padding: 0 var(--space-6); flex: 1; }

        .sidebar-section { padding: var(--space-5) 0; border-bottom: var(--stroke-1) solid var(--border-hairline); }
        .sidebar-section:last-child { border-bottom: none; }

        .sidebar-title {
            display: block;
            margin-bottom: var(--space-3);
            font: var(--text-label);
            color: var(--text-muted);
        }

        .filter-group { margin: 0; }
        .checkbox-group { display: flex; flex-direction: column; gap: var(--space-1); }

        .sidebar-foot {
            position: sticky;
            bottom: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-6) var(--space-6);
            background: var(--surface);
            border-top: var(--stroke-1) solid var(--border-hairline);
        }

        .content { padding: var(--space-10) var(--page-gutter) var(--space-16); min-width: 0; }

        .content-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--space-6);
            flex-wrap: wrap;
            margin-bottom: var(--space-8);
            padding-bottom: var(--space-6);
            border-bottom: var(--stroke-1) solid var(--border-hairline);
        }
        .page-title { font: var(--text-display-md); font-stretch: 112%; margin-bottom: var(--space-3); }

        .results-count { display: flex; align-items: baseline; gap: var(--space-3); }
        .results-label { font: var(--text-label); color: var(--text-muted); }
        #resultsCount { font: var(--text-stat); font-variant-numeric: tabular-nums; color: var(--text-primary); }

        .content-tools { display: flex; align-items: center; gap: var(--space-3); }
        .sort-dropdown { display: flex; align-items: center; gap: var(--space-3); }
        .sort-label { font: var(--text-label); color: var(--text-muted); white-space: nowrap; }
        .sort-dropdown .bl-select { min-width: calc(var(--space-24) * 2); }

        /* ==========================================================
           VEHICLE GRID + CARD
           ========================================================== */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-6);
        }

        .flip-card { position: relative; cursor: pointer; border-radius: var(--radius-md); }
        .flip-card-inner { display: grid; height: 100%; }

        .flip-card-front, .flip-card-back {
            grid-area: 1 / 1;
            min-width: 0;
            background: var(--surface);
            border: var(--stroke-1) solid var(--border-hairline);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition:
                opacity var(--bl-dur-slow) var(--bl-ease),
                visibility var(--bl-dur-slow) var(--bl-ease),
                transform var(--bl-dur) var(--bl-ease),
                border-color var(--bl-dur) var(--bl-ease),
                box-shadow var(--bl-dur) var(--bl-ease);
        }
        .flip-card-front { display: flex; flex-direction: column; }
        .flip-card-back {
            display: flex;
            flex-direction: column;
            background: var(--surface-raised);
            border-color: var(--border);
            opacity: 0;
            visibility: hidden;
        }
        .flip-card.flipped .flip-card-front { opacity: 0; visibility: hidden; }
        .flip-card.flipped .flip-card-back { opacity: 1; visibility: visible; }

        .flip-card:hover .flip-card-front {
            transform: translateY(calc(var(--space-half) * -1));
            border-color: var(--border);
            box-shadow: var(--shadow-raised);
        }

        .card-image-container {
            position: relative;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: radial-gradient(ellipse 70% 60% at 50% 42%, var(--surface-overlay) 0%, var(--surface) 55%, var(--surface-page) 100%);
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--bl-dur-slow) var(--bl-ease);
        }
        .flip-card:hover .card-image { transform: scale(1.028); }

        .car-placeholder {
            position: absolute;
            inset: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            color: var(--text-muted);
            font: var(--text-caption);
        }

        .import-status {
            position: absolute;
            left: var(--space-3);
            bottom: var(--space-3);
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            height: var(--space-6);
            padding: 0 var(--space-2);
            background: var(--badge-backing);
            border: var(--stroke-1) solid var(--border);
            border-radius: var(--radius-xs);
            font: var(--text-button-sm);
        }
        .import-status .bl-ic { width: var(--space-3); height: var(--space-3); stroke-width: 2; }
        .import-status.imported { color: var(--success-text); border-color: var(--success-border); }
        .import-status.not-imported { color: var(--info-text); border-color: var(--info-border); }

        .card-content { display: flex; flex-direction: column; flex: 1; padding: var(--space-5) var(--space-5) var(--space-4); }
        .card-header { margin-bottom: var(--space-4); }
        .car-make {
            font: var(--text-label-micro);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            transition: color var(--bl-dur-fast) var(--bl-ease);
        }
        .flip-card:hover .car-make { color: var(--text-accent); }
        .car-name {
            margin-top: var(--space-1);
            font: var(--text-title-lg);
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: var(--space-2);
        }
        .stat-box { min-width: 0; }
        .stat-box-label { font: var(--text-caption); color: var(--text-muted); margin-bottom: var(--space-half); }
        .stat-box-value {
            font: var(--text-numeric-sm);
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            margin-top: auto;
            padding-top: var(--space-4);
            border-top: var(--stroke-1) solid var(--border-hairline);
        }
        .card-content .stats-grid { margin-bottom: var(--space-4); }

        .price-badge { font: var(--text-price); font-variant-numeric: tabular-nums; color: var(--text-accent); }

        .flip-hint {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            font: var(--text-button-sm);
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity var(--bl-dur) var(--bl-ease);
        }
        .flip-card:hover .flip-hint { opacity: 1; }
        @media (hover: none) { .flip-hint { opacity: 1; } }

        /* Back face: stock versus tuned */
        .back-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5);
            border-bottom: var(--stroke-1) solid var(--border-hairline);
        }
        .back-kicker { font: var(--text-label); color: var(--text-muted); }
        .back-title { font: var(--text-title-lg); color: var(--text-primary); }

        .close-btn {
            display: grid;
            place-items: center;
            width: var(--control-sm);
            height: var(--control-sm);
            background: transparent;
            border: var(--stroke-1) solid var(--border-control);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color var(--bl-dur-fast) var(--bl-ease), color var(--bl-dur-fast) var(--bl-ease);
        }
        .close-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
        .close-btn .bl-ic { width: var(--icon-sm); height: var(--icon-sm); }

        .stats-legend {
            display: flex;
            gap: var(--space-4);
            padding: var(--space-3) var(--space-5) 0;
            font: var(--text-caption);
            color: var(--text-muted);
        }
        .stats-legend span { display: inline-flex; align-items: center; gap: var(--space-2); }
        .stats-legend i { display: inline-block; width: var(--space-3); height: var(--space-1); background: var(--text-secondary); }
        .stats-legend i.tuned { background: var(--accent); }

        .stats-comparison {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-5) var(--space-4);
            overflow-y: auto;
        }
        .comparison-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: baseline;
            row-gap: var(--space-1);
        }
        .comparison-label { font: var(--text-label); color: var(--text-muted); }
        .comparison-values { display: inline-flex; align-items: center; gap: var(--space-2); }
        .comparison-values .bl-ic { width: var(--space-3); height: var(--space-3); color: var(--text-muted); }
        .comparison-value { font: var(--text-numeric); font-variant-numeric: tabular-nums; }
        .comparison-value.stock { color: var(--text-secondary); }
        .comparison-value.potential { color: var(--text-accent); font-weight: 600; }
        .comparison-track {
            grid-column: 1 / -1;
            position: relative;
            height: var(--space-1);
            background: var(--accent);
            border-radius: var(--radius-xs);
            overflow: hidden;
        }
        .comparison-track span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text-secondary); }

        .back-actions {
            display: flex;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5);
            border-top: var(--stroke-1) solid var(--border-hairline);
        }
        .back-actions .bl-btn { flex: 1; }

        /* Loading skeleton: the only loop in the system */
        .skel-card {
            background: var(--surface);
            border: var(--stroke-1) solid var(--border-hairline);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .skel {
            background-color: var(--surface-raised);
            background-image: linear-gradient(90deg, transparent 0%, var(--metal-highlight) 50%, transparent 100%);
            background-size: 200% 100%;
            background-repeat: no-repeat;
            animation: bl-sweep 1.4s linear infinite;
            border-radius: var(--radius-xs);
        }
        .skel-media { aspect-ratio: 16 / 10; border-radius: 0; }
        .skel-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
        .skel-line { height: var(--space-3); }
        .skel-line.w-30 { width: 30%; }
        .skel-line.w-60 { width: 60%; height: var(--space-5); }
        .skel-line.w-90 { width: 90%; }
        .skel-line.w-40 { width: 40%; height: var(--space-6); margin-top: var(--space-3); }
        @keyframes bl-sweep {
            from { background-position: 150% 0; }
            to { background-position: -50% 0; }
        }

        .no-results {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-16) var(--space-6);
            text-align: center;
            background: var(--surface);
            border: var(--stroke-1) solid var(--border-hairline);
            border-radius: var(--radius-md);
            color: var(--text-muted);
        }
        .no-results h3 { font: var(--text-heading-2); font-stretch: 112%; color: var(--text-primary); }
        .no-results p { color: var(--text-secondary); max-width: 52ch; margin-bottom: var(--space-3); }

        /* ==========================================================
           NARROW: the rail becomes a bottom sheet (CSS only)
           ========================================================== */
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: minmax(0, 1fr); }

            .sidebar {
                position: fixed;
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                height: auto;
                max-height: 85vh;
                z-index: var(--z-drawer);
                border-right: none;
                border-top: var(--stroke-1) solid var(--border);
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                box-shadow: var(--shadow-modal);
                transform: translateY(100%);
                visibility: hidden;
                transition: transform var(--bl-dur-slow) var(--bl-ease), visibility var(--bl-dur-slow) var(--bl-ease);
            }
            .sheet-toggle:checked ~ .sidebar { transform: none; visibility: visible; }

            .sheet-toggle:checked ~ .sheet-scrim {
                display: block;
                position: fixed;
                inset: 0;
                z-index: calc(var(--z-drawer) - 1);
                background: var(--scrim);
            }
            .sheet-toggle:focus-visible ~ .content .filter-open-btn { box-shadow: var(--shadow-focus); }

            .content { padding-top: var(--space-8); }
        }
        @media (max-width: 520px) {
            .content-tools { width: 100%; }
            .sort-dropdown { flex: 1; }
            .sort-label { display: none; }
            .sort-dropdown .bl-select { flex: 1; min-width: 0; }
            .vehicle-grid { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body class="bl-root">

                <div class="skel-card" aria-hidden="true"><div class="skel skel-media"></div><div class="skel-body"><div class="skel skel-line w-30"></div><div class="skel skel-line w-60"></div><div class="skel skel-line w-90"></div><div class="skel skel-line w-40"></div></div></div>
                <div class="skel-card" aria-hidden="true"><div class="skel skel-media"></div><div class="skel-body"><div class="skel skel-line w-30"></div><div class="skel skel-line w-60"></div><div class="skel skel-line w-90"></div><div class="skel skel-line w-40"></div></div></div>

                <div class="skel-card" aria-hidden="true"><div class="skel skel-media"></div><div class="skel-body"><div class="skel skel-line w-30"></div><div class="skel skel-line w-60"></div><div class="skel skel-line w-90"></div><div class="skel skel-line w-40"></div></div></div>

    <script>
        let vehicles = [];
        let filteredVehicles = [];

        function generateCards(vehicleList) {
            const grid = document.getElementById('vehicleGrid');
            grid.innerHTML = '';

            if (vehicleList.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <svg class="bl-ic bl-ic--lg"><use href="#i-search"></use></svg>
                        <h3>No vehicles match these filters</h3>
                        <p>Clear a filter, or reset them all to see the full list.</p>
                        <button class="bl-btn bl-btn--secondary" onclick="resetFilters()">Reset filters</button>
                    </div>
                `;
                document.getElementById('resultsCount').textContent = '0';
                return;
            }

            vehicleList.forEach((vehicle, index) => {
                const card = document.createElement('div');
                card.className = 'flip-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = function(e) {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    this.classList.toggle('flipped');
                };

                const shortName = vehicle.name.split(' ').slice(1).join(' ') || vehicle.name;
                const statLabels = { hp: 'HP', speed: 'Speed', rating: 'Rating', accel: 'Accel', grip: 'Grip', platform: 'Platform', braking: 'Braking' };

                let statRows = '';
                for (const [key, value] of Object.entries(vehicle.stats)) {
                    const [stock, potential] = value.split('/');
                    // Visual only: share of the tuned figure already present at stock
                    const stockNum = parseFloat(String(stock).replace(/[^0-9.]/g, ''));
                    const potentialNum = parseFloat(String(potential).replace(/[^0-9.]/g, ''));
                    const stockPct = stockNum > 0 && potentialNum > 0 ? Math.min(100, stockNum / Math.max(stockNum, potentialNum) * 100) : 100;
                    statRows += `
                        <div class="comparison-row">
                            <div class="comparison-label">${statLabels[key]}</div>
                            <div class="comparison-values">
                                <span class="comparison-value stock">${stock}</span>
                                <svg class="bl-ic"><use href="#i-arrow-right"></use></svg>
                                <span class="comparison-value potential">${potential}</span>
                            </div>
                            <div class="comparison-track"><span style="width: ${stockPct}%"></span></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="card-image-container">
                                <img src="images/${vehicle.image}" alt="${vehicle.name}" class="card-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="car-placeholder" style="display: none;"><svg class="bl-ic bl-ic--lg"><use href="#i-image"></use></svg><span>Photograph to follow</span></div>
                                <div class="import-status ${vehicle.status}">${vehicle.status === 'imported' ? '<svg class="bl-ic"><use href="#i-check"></use></svg>Imported' : '<svg class="bl-ic"><use href="#i-import"></use></svg>Not yet imported'}</div>
                            </div>
                            <div class="card-content">
                                <div class="card-header">
                                    <div class="car-make">${vehicle.name.split(' ')[0]}</div>
                                    <div class="car-name">${shortName}</div>
                                </div>
                                <dl class="stats-grid">
                                    <div class="stat-box"><dt class="stat-box-label">Year</dt><dd class="stat-box-value">${vehicle.year}</dd></div>
                                    <div class="stat-box"><dt class="stat-box-label">Miles</dt><dd class="stat-box-value">${vehicle.miles}</dd></div>
                                    <div class="stat-box"><dt class="stat-box-label">Rating</dt><dd class="stat-box-value">${vehicle.rating}</dd></div>
                                    <div class="stat-box"><dt class="stat-box-label">Engine</dt><dd class="stat-box-value">${vehicle.engine}</dd></div>
                                    <div class="stat-box"><dt class="stat-box-label">Seats</dt><dd class="stat-box-value">${vehicle.seats}</dd></div>
                                </dl>
                                <div class="card-foot">
                                    <div class="price-badge">${vehicle.price}</div>
                                    <div class="flip-hint">Performance <svg class="bl-ic bl-ic--sm"><use href="#i-arrow-right"></use></svg></div>
                                </div>
                            </div>
                        </div>
                        <div class="flip-card-back">
                            <div class="back-header">
                                <div>
                                    <div class="back-kicker">Stock and tuned figures</div>
                                    <div class="back-title">${shortName}</div>
                                </div>
                                <button class="close-btn" aria-label="Close performance figures" onclick="event.stopPropagation(); this.closest('.flip-card').classList.remove('flipped')"><svg class="bl-ic"><use href="#i-close"></use></svg></button>
                            </div>
                            <div class="stats-legend"><span><i></i>Stock</span><span><i class="tuned"></i>Tuned</span></div>
                            <div class="stats-comparison">${statRows}</div>
                            <div class="back-actions">
                                <a href="/appointments?car=${encodeURIComponent(vehicle.name)}" class="action-btn primary bl-btn bl-btn--primary" onclick="event.stopPropagation()"><svg class="bl-ic"><use href="#i-calendar"></use></svg> Book a viewing</a>
                                <button class="action-btn secondary bl-btn bl-btn--secondary" onclick="event.stopPropagation(); this.closest('.flip-card').classList.remove('flipped')"><svg class="bl-ic"><use href="#i-arrow-left"></use></svg> Back</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('resultsCount').textContent = vehicleList.length;
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const makeFilter = document.getElementById('makeFilter').value;
            const checkedEngines = Array.from(document.querySelectorAll('#engineFilters input:checked')).map(cb => cb.value);
            const checkedStatuses = Array.from(document.querySelectorAll('#statusFilters input:checked')).map(cb => cb.value);

            filteredVehicles = vehicles.filter(vehicle => {
                if (searchTerm && !vehicle.name.toLowerCase().includes(searchTerm)) return false;
                if (categoryFilter !== 'all' && vehicle.category !== categoryFilter) return false;
                if (makeFilter !== 'all' && vehicle.make !== makeFilter) return false;
                if (checkedEngines.length > 0 && !checkedEngines.includes(vehicle.engine)) return false;
                if (checkedStatuses.length > 0 && !checkedStatuses.includes(vehicle.status)) return false;
                return true;
            });

            sortVehicles();
        }

        function sortVehicles() {
            const sortValue = document.getElementById('sortSelect').value;
            filteredVehicles.sort((a, b) => {
                switch(sortValue) {
                    case 'price-desc': return b.priceNum - a.priceNum;
                    case 'price-asc': return a.priceNum - b.priceNum;
                    case 'year-desc': return b.yearNum - a.yearNum;
                    case 'year-asc': return a.yearNum - b.yearNum;
                    case 'rating-desc': return b.ratingNum - a.ratingNum;
                    case 'rating-asc': return a.ratingNum - b.ratingNum;
                    default: return 0;
                }
            });
            generateCards(filteredVehicles);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('makeFilter').value = 'all';
            document.getElementById('sortSelect').value = 'price-desc';
            document.querySelectorAll('#engineFilters input').forEach(cb => cb.checked = false);
            document.querySelectorAll('#statusFilters input').forEach(cb => cb.checked = cb.value === 'not-imported');
            filteredVehicles = [...vehicles];
            sortVehicles();
        }

        async function loadVehicles() {
            try {
                const response = await fetch('/.netlify/functions/inventory');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                vehicles = await response.json();
                if (!Array.isArray(vehicles)) throw new Error('Invalid data');
                filteredVehicles = [...vehicles];
                applyFilters();
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('vehicleGrid').innerHTML = `
                    <div class="no-results">
                        <svg class="bl-ic bl-ic--lg"><use href="#i-alert-triangle"></use></svg>
                        <h3>The inventory did not load</h3>
                        <p>${error.message}. Check your connection and try again.</p>
                        <button class="bl-btn bl-btn--secondary" onclick="loadVehicles()">Try again</button>
                    </div>
                `;
            }
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyFilters);
        document.getElementById('makeFilter').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', sortVehicles);
        document.querySelectorAll('#engineFilters input, #statusFilters input').forEach(cb => cb.addEventListener('change', applyFilters));

        loadVehicles();
    </script>
</body>
</html>
