<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Label Autos | Supercar Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-card: #1c2128;
            --accent-gold: #c9a227;
            --accent-gold-light: #e8d48b;
            --accent-red: #dc2626;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.2rem 5%;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201, 162, 39, 0.2);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .nav-logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--bg-primary);
        }

        .nav-logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .nav-logo-text span { color: var(--accent-gold); }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--accent-gold); }

        .nav-cta {
            padding: 0.7rem 1.5rem;
            background: var(--accent-gold);
            color: var(--bg-primary);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .nav-cta:hover {
            background: var(--accent-gold-light);
            transform: translateY(-2px);
        }

        .main-container {
            display: flex;
            min-height: 100vh;
            padding-top: 80px;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
            position: sticky;
            top: 80px;
        }

        .sidebar-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section:last-child { border-bottom: none; }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group { margin-bottom: 1rem; }

        .filter-input, .filter-select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .filter-input:focus, .filter-select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-gold);
        }

        .reset-btn {
            width: 100%;
            padding: 0.8rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .reset-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .results-count span {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .sort-dropdown {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sort-dropdown span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .sort-dropdown select {
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .flip-card {
            background: transparent;
            perspective: 1000px;
            height: 380px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
        }

        .flip-card-front {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .flip-card:hover .flip-card-front {
            border-color: var(--accent-gold);
            box-shadow: 0 8px 32px rgba(201, 162, 39, 0.15);
        }

        .flip-card-back {
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
        }

        .card-image-container {
            position: relative;
            height: 250px;
            background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-placeholder {
            font-size: 4rem;
            color: var(--accent-gold);
            opacity: 0.3;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .flip-card:hover .card-image {
            transform: scale(1.05);
        }

        .price-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent-blue);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .import-status {
            position: absolute;
            bottom: 12px;
            left: 12px;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .import-status.imported {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .import-status.not-imported {
            background: rgba(220, 38, 38, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .card-content {
            padding: 0.6rem 1rem;
        }

        .card-header {
            margin-bottom: 0.5rem;
        }

        .car-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.4rem;
        }

        .stat-box {
            text-align: center;
            padding: 0.35rem 0.2rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-box-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.1rem;
        }

        .stat-box-label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .flip-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .flip-card:hover .flip-hint {
            opacity: 1;
        }

        .back-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .back-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .stats-comparison {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            overflow-y: auto;
        }

        .comparison-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .comparison-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .comparison-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .comparison-value.stock {
            color: var(--text-secondary);
            text-align: left;
        }

        .comparison-value.potential {
            color: var(--accent-gold);
            text-align: right;
        }

        .potential-arrow {
            color: var(--accent-green);
            font-size: 0.7rem;
            margin-left: 0.3rem;
        }

        .back-actions {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.8rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            text-decoration: none;
        }

        .action-btn.primary {
            background: var(--accent-gold);
            color: var(--bg-primary);
        }

        .action-btn.primary:hover {
            background: var(--accent-gold-light);
        }

        .action-btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .action-btn.secondary:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent-gold);
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
                position: relative;
                top: 0;
            }

            .vehicle-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-logo">
            <div class="nav-logo-icon">
                <i class="fas fa-crown"></i>
            </div>
            <div class="nav-logo-text">BLACK <span>LABEL</span></div>
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/inventory">Inventory</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>
        <a href="/appointments" class="nav-cta">Book Now</a>
    </nav>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-search"></i> Search</div>
                <div class="filter-group">
                    <input type="text" class="filter-input" id="searchInput" placeholder="Search vehicles...">
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-filter"></i> Category</div>
                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="super">Super</option>
                    <option value="sports">Sports</option>
                </select>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-car"></i> Make</div>
                <select class="filter-select" id="makeFilter">
                    <option value="all">All Makes</option>
                    <option value="pegassi">Pegassi</option>
                    <option value="grotti">Grotti</option>
                    <option value="bravado">Bravado</option>
                    <option value="obey">Obey</option>
                    <option value="lampadati">Lampadati</option>
                    <option value="benefactor">Benefactor</option>
                    <option value="dinka">Dinka</option>
                    <option value="ubermacht">Ubermacht</option>
                    <option value="hijak">Hijak</option>
                    <option value="dewbauchee">Dewbauchee</option>
                </select>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-cog"></i> Engine</div>
                <div class="checkbox-group" id="engineFilters">
                    <label class="checkbox-item"><input type="checkbox" value="V6"> V6</label>
                    <label class="checkbox-item"><input type="checkbox" value="V8"> V8</label>
                    <label class="checkbox-item"><input type="checkbox" value="V10"> V10</label>
                    <label class="checkbox-item"><input type="checkbox" value="V12"> V12</label>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title"><i class="fas fa-globe"></i> Import Status</div>
                <div class="checkbox-group" id="statusFilters">
                    <label class="checkbox-item"><input type="checkbox" value="imported"> Imported</label>
                    <label class="checkbox-item"><input type="checkbox" value="not-imported" checked> Available to Import</label>
                </div>
            </div>

            <button class="reset-btn" onclick="resetFilters()">
                <i class="fas fa-undo"></i> Reset Filters
            </button>
        </aside>

        <main class="content">
            <div class="content-header">
                <div class="results-count">Showing <span id="resultsCount">0</span> unique supercars</div>
                <div class="sort-dropdown">
                    <span>Sort by:</span>
                    <select id="sortSelect">
                        <option value="price-desc">Price: High to Low</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="year-desc">Year: Newest First</option>
                        <option value="year-asc">Year: Oldest First</option>
                        <option value="rating-desc">Rating: Highest</option>
                        <option value="rating-asc">Rating: Lowest</option>
                    </select>
                </div>
            </div>

            <div class="vehicle-grid" id="vehicleGrid">
                <div class="no-results">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading inventory</h3>
                    <p>Pulling the latest vehicles...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let vehicles = [];
        let filteredVehicles = [];

        function generateCards(vehicleList) {
            const grid = document.getElementById('vehicleGrid');
            grid.innerHTML = '';

            if (vehicleList.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No vehicles found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                document.getElementById('resultsCount').textContent = '0';
                return;
            }

            vehicleList.forEach((vehicle, index) => {
                const card = document.createElement('div');
                card.className = 'flip-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = function(e) {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    this.classList.toggle('flipped');
                };

                const shortName = vehicle.name.split(' ').slice(1).join(' ') || vehicle.name;
                const statLabels = { hp: 'HP', speed: 'Speed', rating: 'Rating', accel: 'Accel', grip: 'Grip', platform: 'Platform', braking: 'Braking' };

                let statRows = '';
                for (const [key, value] of Object.entries(vehicle.stats)) {
                    const [stock, potential] = value.split('/');
                    statRows += `
                        <div class="comparison-row">
                            <div class="comparison-value stock">${stock}</div>
                            <div class="comparison-label">${statLabels[key]}</div>
                            <div class="comparison-value potential">${potential}<i class="fas fa-arrow-up potential-arrow"></i></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="card-image-container">
                                <img src="images/${vehicle.image}" alt="${vehicle.name}" class="card-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="car-placeholder" style="display: none;"><i class="fas fa-car"></i></div>
                                <div class="price-badge">${vehicle.price}</div>
                                <div class="import-status ${vehicle.status}">${vehicle.status === 'imported' ? 'Imported' : 'Not Yet Imported'}</div>
                            </div>
                            <div class="card-content">
                                <div class="card-header">
                                    <div class="car-name">${vehicle.name}</div>
                                </div>
                                <div class="stats-grid">
                                    <div class="stat-box"><div class="stat-box-value">${vehicle.year}</div><div class="stat-box-label">Year</div></div>
                                    <div class="stat-box"><div class="stat-box-value">${vehicle.miles}</div><div class="stat-box-label">Miles</div></div>
                                    <div class="stat-box"><div class="stat-box-value">${vehicle.rating}</div><div class="stat-box-label">Rating</div></div>
                                    <div class="stat-box"><div class="stat-box-value">${vehicle.engine}</div><div class="stat-box-label">Engine</div></div>
                                    <div class="stat-box"><div class="stat-box-value">${vehicle.seats}</div><div class="stat-box-label">Seats</div></div>
                                </div>
                            </div>
                            <div class="flip-hint"><i class="fas fa-sync-alt"></i> Click for stats</div>
                        </div>
                        <div class="flip-card-back">
                            <div class="back-header">
                                <div class="back-title">${shortName}</div>
                                <button class="close-btn" onclick="event.stopPropagation(); this.closest('.flip-card').classList.remove('flipped')"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="stats-comparison">${statRows}</div>
                            <div class="back-actions">
                                <a href="/appointments?car=${encodeURIComponent(vehicle.name)}" class="action-btn primary" onclick="event.stopPropagation()"><i class="fas fa-calendar-check"></i> Book Viewing</a>
                                <button class="action-btn secondary" onclick="event.stopPropagation(); this.closest('.flip-card').classList.remove('flipped')"><i class="fas fa-undo"></i> Back</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('resultsCount').textContent = vehicleList.length;
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const makeFilter = document.getElementById('makeFilter').value;
            const checkedEngines = Array.from(document.querySelectorAll('#engineFilters input:checked')).map(cb => cb.value);
            const checkedStatuses = Array.from(document.querySelectorAll('#statusFilters input:checked')).map(cb => cb.value);

            filteredVehicles = vehicles.filter(vehicle => {
                if (searchTerm && !vehicle.name.toLowerCase().includes(searchTerm)) return false;
                if (categoryFilter !== 'all' && vehicle.category !== categoryFilter) return false;
                if (makeFilter !== 'all' && vehicle.make !== makeFilter) return false;
                if (checkedEngines.length > 0 && !checkedEngines.includes(vehicle.engine)) return false;
                if (checkedStatuses.length > 0 && !checkedStatuses.includes(vehicle.status)) return false;
                return true;
            });

            sortVehicles();
        }

        function sortVehicles() {
            const sortValue = document.getElementById('sortSelect').value;
            filteredVehicles.sort((a, b) => {
                switch(sortValue) {
                    case 'price-desc': return b.priceNum - a.priceNum;
                    case 'price-asc': return a.priceNum - b.priceNum;
                    case 'year-desc': return b.yearNum - a.yearNum;
                    case 'year-asc': return a.yearNum - b.yearNum;
                    case 'rating-desc': return b.ratingNum - a.ratingNum;
                    case 'rating-asc': return a.ratingNum - b.ratingNum;
                    default: return 0;
                }
            });
            generateCards(filteredVehicles);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('makeFilter').value = 'all';
            document.getElementById('sortSelect').value = 'price-desc';
            document.querySelectorAll('#engineFilters input').forEach(cb => cb.checked = false);
            document.querySelectorAll('#statusFilters input').forEach(cb => cb.checked = cb.value === 'not-imported');
            filteredVehicles = [...vehicles];
            sortVehicles();
        }

        async function loadVehicles() {
            try {
                const response = await fetch('/.netlify/functions/inventory');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                vehicles = await response.json();
                if (!Array.isArray(vehicles)) throw new Error('Invalid data');
                filteredVehicles = [...vehicles];
                applyFilters();
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('vehicleGrid').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Failed to load inventory</h3>
                        <p>${error.message}</p>
                        <button class="reset-btn" onclick="loadVehicles()"><i class="fas fa-redo"></i> Retry</button>
                    </div>
                `;
            }
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyFilters);
        document.getElementById('makeFilter').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', sortVehicles);
        document.querySelectorAll('#engineFilters input, #statusFilters input').forEach(cb => cb.addEventListener('change', applyFilters));

        loadVehicles();
    </script>
</body>
</html>
